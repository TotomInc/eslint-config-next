name: Build

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm i --no-audit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
